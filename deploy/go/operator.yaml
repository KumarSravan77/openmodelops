apiVersion: v1
kind: ServiceAccount
metadata: {name: openmodelops-operator, namespace: openmodelops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: openmodelops-operator}
rules:
  - apiGroups: [platform.openmodelops.io]
    resources: [modeldeployments, agentdeployments, evaluationruns]
    verbs: [get, list, watch]
  - apiGroups: [platform.openmodelops.io]
    resources: [modeldeployments/status, agentdeployments/status, evaluationruns/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: openmodelops-operator}
subjects: [{kind: ServiceAccount, name: openmodelops-operator, namespace: openmodelops}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: openmodelops-operator}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: openmodelops-operator, namespace: openmodelops}
spec:
  replicas: 2
  selector: {matchLabels: {app: openmodelops-operator}}
  template:
    metadata: {labels: {app: openmodelops-operator}}
    spec:
      serviceAccountName: openmodelops-operator
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: operator
          image: openmodelops-operator:local
          imagePullPolicy: Never
          ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: health}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
