apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: openmodelops}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-platform, namespace: openmodelops}
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openmodelops}}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sre}}
    - ports:
        - {protocol: TCP, port: 8000}
