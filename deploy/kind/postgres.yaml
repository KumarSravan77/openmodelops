apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: openmodelops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: openmodelops}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - {name: POSTGRES_DB, value: openmodelops}
            - {name: POSTGRES_USER, value: openmodelops}
            - {name: POSTGRES_PASSWORD, value: local-only}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, openmodelops, -d, openmodelops]}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: openmodelops}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
