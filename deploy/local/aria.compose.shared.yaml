services:
  checkout-api:
    ports: !override ["9100:9000"]
  aria-api:
    ports: !override ["8088:8080"]
    environment:
      OPENMODELOPS_FACTORY_URL: http://factory-api:8000
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      default:
      shared-local:
        aliases: [aria-api]
  worker:
    networks: [default, shared-local]

networks:
  shared-local:
    external: true
    name: openmodelops-local
