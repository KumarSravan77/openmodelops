global:
  scrape_interval: 15s

scrape_configs:
  - job_name: openmodelops-mlops
    static_configs: [{ targets: ["mlops-api:8000"] }]
  - job_name: openmodelops-agents
    static_configs: [{ targets: ["agent-api:8000"] }]
  - job_name: openmodelops-kubernetes-sre
    static_configs: [{ targets: ["kubernetes-sre-api:8000"] }]
  - job_name: synthetic-banking-workload
    static_configs: [{ targets: ["banking-api:8000"] }]
  - job_name: openmodelops-judgeops
    static_configs: [{ targets: ["judgeops-api:8000"] }]
