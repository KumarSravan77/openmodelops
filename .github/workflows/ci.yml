name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Reject employer-specific or credential material
        run: |
          if grep -RniE 'AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH) PRIVATE KEY' \
            --exclude-dir=.git .; then
            echo 'Public-safety content policy failed'
            exit 1
          fi

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mlops, agents, aiops, factory, reviewer, kubernetes_sre, judgeops]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            EXTRAS=${{ matrix.service == 'kubernetes_sre' && 'kubernetes-sre' || '' }}
          tags: openmodelops-${{ matrix.service }}:${{ github.sha }}

  optional-frameworks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: rag
            expression: rag_frameworks
          - extra: evaluation
            expression: evaluation_frameworks
          - extra: observability
            expression: observability_frameworks
          - extra: kubernetes-sre
            expression: kubernetes_sre_framework
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,${{ matrix.extra }}]"
      - run: pytest -q tests/test_optional_frameworks.py -k "${{ matrix.expression }}"
