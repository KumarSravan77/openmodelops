[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openmodelops-ai-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]
rag = ["langchain-core>=0.3,<2", "langgraph>=0.6,<2"]
evaluation = ["ragas>=0.3,<1", "deepeval>=3.3,<4"]
observability = ["langfuse>=4.7,<5", "opik>=1.8,<2", "arize-phoenix-otel>=0.16,<1"]
kubernetes-sre = ["kubernetes>=36.0.3,<37"]
metal = ["mlx-lm>=0.30,<1; platform_system == 'Darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["packages*", "platforms*"]

[tool.ruff]
line-length = 120
target-version = "py311"
