services:
  mlops-api:
    build:
      context: .
      args: { SERVICE: mlops }
    ports: ["8001:8000"]
    environment:
      MLOPS_DB_PATH: /data/mlops.db
    volumes: ["mlops-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  agent-api:
    build:
      context: .
      args: { SERVICE: agents }
    ports: ["8002:8000"]
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL_ID: ${MODEL_ID:-qwen2.5:3b}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://ollama:11434}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  aiops-api:
    build:
      context: .
      args: { SERVICE: aiops }
    ports: ["8003:8000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  factory-api:
    build:
      context: .
      args: { SERVICE: factory }
    ports: ["8004:8000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["local-models"]
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    profiles: ["retrieval"]
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    profiles: ["feature-store"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    profiles: ["identity"]
    command: ["start-dev", "--health-enabled=true"]
    ports: ["8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-shared-use}
    restart: unless-stopped

  ray-head:
    image: rayproject/ray:2.49.0-py312
    profiles: ["distributed-training"]
    command: ["ray", "start", "--head", "--dashboard-host=0.0.0.0", "--block"]
    ports: ["8265:8265", "10001:10001"]
    shm_size: 2gb
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-shared-use}
    volumes: ["grafana-data:/var/lib/grafana"]
    restart: unless-stopped

volumes:
  mlops-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
  ollama-data:
  qdrant-data:
  redis-data:
