services:
  mlops-api:
    build:
      context: .
      args: { SERVICE: mlops }
    ports: ["8001:8000"]
    environment:
      MLOPS_DB_PATH: /data/mlops.db
    volumes: ["mlops-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  agent-api:
    build:
      context: .
      args: { SERVICE: agents }
    ports: ["8002:8000"]
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      MODEL_ID: ${MODEL_ID:-qwen2.5:3b}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://ollama:11434}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OPENMODELOPS_TELEMETRY_PROVIDER: ${OPENMODELOPS_TELEMETRY_PROVIDER:-otlp}
      OPENMODELOPS_CAPTURE_AI_CONTENT: ${OPENMODELOPS_CAPTURE_AI_CONTENT:-false}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  aiops-api:
    build:
      context: .
      args: { SERVICE: aiops }
    ports: ["8003:8000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  kubernetes-sre-api:
    profiles: ["kubernetes-sre"]
    build:
      context: .
      args: { SERVICE: kubernetes_sre, EXTRAS: kubernetes-sre }
    ports: ["8006:8000"]
    environment:
      KUBERNETES_SRE_DB: /data/kubernetes-sre.db
      KUBERNETES_SRE_CLUSTER: ${KUBERNETES_SRE_CLUSTER:-local}
      KUBERNETES_SRE_MANAGED_NAMESPACES: ${KUBERNETES_SRE_MANAGED_NAMESPACES:-openmodelops-managed}
      KUBERNETES_SRE_EXECUTION_ENABLED: ${KUBERNETES_SRE_EXECUTION_ENABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-development}
    volumes:
      - kubernetes-sre-data:/data
      - ${KUBECONFIG:-/dev/null}:/home/openmodelops/.kube/config:ro
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  reviewer-api:
    build:
      context: .
      args: { SERVICE: reviewer }
    ports: ["8005:8000"]
    environment:
      REVIEW_AGENT_CONFIG: .beacode/beacode-config.yaml
      REVIEW_AGENT_DB: /data/reviewer.db
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-development}
    volumes: ["reviewer-data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  factory-api:
    build:
      context: .
      args: { SERVICE: factory }
    ports: ["8004:8000"]
    environment:
      FACTORY_DATABASE_URL: postgresql+psycopg://openmodelops:${FACTORY_DB_PASSWORD:-local-development-only}@factory-db:5432/openmodelops
      AUTH_MODE: ${AUTH_MODE:-development}
      FACTORY_ENV: ${FACTORY_ENV:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      EVIDENCE_PUBLIC_KEYS_JSON: ${EVIDENCE_PUBLIC_KEYS_JSON:-{}}
      ARIA_INTEGRATION_SECRET: ${ARIA_INTEGRATION_SECRET:-}
    depends_on:
      factory-db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  factory-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: openmodelops
      POSTGRES_USER: openmodelops
      POSTGRES_PASSWORD: ${FACTORY_DB_PASSWORD:-local-development-only}
    volumes: ["factory-db-data:/var/lib/postgresql/data"]
    configs:
      - source: factory-schema
        target: /docker-entrypoint-initdb.d/001_factory.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmodelops -d openmodelops"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["local-models"]
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    profiles: ["retrieval"]
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    profiles: ["feature-store"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    profiles: ["identity"]
    command: ["start-dev", "--health-enabled=true"]
    ports: ["8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-shared-use}
    restart: unless-stopped

  ray-head:
    image: rayproject/ray:2.49.0-py312
    profiles: ["distributed-training"]
    command: ["ray", "start", "--head", "--dashboard-host=0.0.0.0", "--block"]
    ports: ["8265:8265", "10001:10001"]
    shm_size: 2gb
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    profiles: ["telemetry"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-shared-use}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  mlops-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
  ollama-data:
  qdrant-data:
  redis-data:
  factory-db-data:
  reviewer-data:
  kubernetes-sre-data:

configs:
  factory-schema:
    file: ./infra/postgres/001_factory.sql
