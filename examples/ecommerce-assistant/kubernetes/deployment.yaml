apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-assistant
  namespace: openmodelops-managed
spec:
  replicas: 2
  selector:
    matchLabels: {app: ecommerce-assistant}
  template:
    metadata:
      labels: {app: ecommerce-assistant}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: openmodelops-ecommerce:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-assistant
  namespace: openmodelops-managed
spec:
  selector: {app: ecommerce-assistant}
  ports: [{name: http, port: 80, targetPort: 8000}]
