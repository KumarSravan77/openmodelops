apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmodelops-sre-reader
  namespace: openmodelops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openmodelops-sre-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openmodelops-sre-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openmodelops-sre-reader
subjects:
  - kind: ServiceAccount
    name: openmodelops-sre-reader
    namespace: openmodelops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-sre-reader
  namespace: openmodelops
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubernetes-sre-reader}
  template:
    metadata:
      labels: {app: kubernetes-sre-reader}
    spec:
      serviceAccountName: openmodelops-sre-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/example/openmodelops-kubernetes-sre:replace-with-immutable-digest
          env:
            - {name: AUTH_MODE, value: oidc}
            - {name: FACTORY_ENV, value: production}
            - {name: KUBERNETES_SRE_EXECUTION_ENABLED, value: "false"}
            - {name: KUBERNETES_SRE_SCHEDULER_ENABLED, value: "true"}
            - {name: KUBERNETES_SRE_DB, value: /data/kubernetes-sre.db}
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kubernetes-sre-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubernetes-sre-data
  namespace: openmodelops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 2Gi}
