apiVersion: v1
kind: Namespace
metadata:
  name: openmodelops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: openmodelops
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: agent-api }
  template:
    metadata:
      labels: { app: agent-api }
    spec:
      serviceAccountName: agent-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: registry.example.test/openmodelops-agent-api@sha256:REPLACE_WITH_APPROVED_DIGEST
          ports: [{ name: http, containerPort: 8000 }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent-api, namespace: openmodelops }
---
apiVersion: v1
kind: Service
metadata: { name: agent-api, namespace: openmodelops }
spec:
  selector: { app: agent-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: agent-api, namespace: openmodelops }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: agent-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: agent-api, namespace: openmodelops }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-api }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agent-api-default-deny, namespace: openmodelops }
spec:
  podSelector: { matchLabels: { app: agent-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-system } }
      ports: [{ protocol: TCP, port: 8000 }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: model-serving } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }]
