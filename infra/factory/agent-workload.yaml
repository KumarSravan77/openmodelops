apiVersion: openmodelops.io/v1alpha1
kind: AIWorkload
metadata:
  name: support-agent
spec:
  kind: agent
  owner: ai-platform-team
  tenant: sample-tenant
  environment: production
  artifactDigest: sha256:replace-with-release-digest
  dataClassification: confidential
  requiresGPU: false
  internetEgress: false
  slo:
    availabilityTarget: 0.999
    latencyP95Ms: 2000
    errorRateTarget: 0.01
  requiredGates:
    - security
    - quality
    - reliability
    - observability
    - cost
    - rollback
